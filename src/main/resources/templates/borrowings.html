<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phiếu mượn | Thư viện</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header th:replace="~{fragments :: nav}"></header><div th:replace="~{fragments :: messages}"></div>
<main class="container"><div class="toolbar"><div><h1>Phiếu mượn</h1><div class="muted">Theo dõi trả sách và phí phạt của độc giả.</div></div><a class="btn" th:href="@{/borrowings/new}">+ Tạo phiếu mượn</a></div>
    <form class="toolbar" method="get" th:action="@{/borrowings}">
        <select name="status" style="max-width:230px"><option value="">Tất cả trạng thái</option>
            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${selectedStatus == status.name()}"></option>
        </select>
        <select name="memberId" style="max-width:230px"><option value="">Tất cả độc giả</option>
            <option th:each="member : ${members}" th:value="${member.id}" th:text="${member.fullName}" th:selected="${selectedMemberId == member.id}"></option>
        </select>
        <input style="max-width:180px" type="date" name="from" aria-label="Từ ngày" th:value="${from}">
        <input style="max-width:180px" type="date" name="to" aria-label="Đến ngày" th:value="${to}">
        <button class="btn secondary" type="submit">Lọc</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>Mã phiếu</th><th>Độc giả</th><th>Ngày mượn</th><th>Hạn trả</th><th>Trạng thái</th><th>Còn nợ</th></tr></thead>
        <tbody><tr th:each="borrowing : ${borrowings}">
            <td><a th:href="@{/borrowings/{id}(id=${borrowing.id})}" th:text="${'#' + borrowing.id}"></a></td>
            <td th:text="${borrowing.member.fullName}"></td><td th:text="${borrowing.borrowedDate}"></td><td th:text="${borrowing.dueDate}"></td>
            <td><span class="badge" th:text="${borrowing.displayStatus.label}"></span></td>
            <td th:text="${borrowing.unpaidFineAmount}"></td>
        </tr><tr th:if="${#lists.isEmpty(borrowings)}"><td colspan="6" class="muted">Chưa có phiếu mượn.</td></tr></tbody></table></div>
</main></body>
</html>
