<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thanh toán phí | Thư viện</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header th:replace="~{fragments :: nav}"></header>
<main class="container"><h1>Thanh toán phí phạt</h1>
    <section class="card"><p>Phiếu <strong th:text="${'#' + borrowing.id}"></strong> — độc giả <strong th:text="${borrowing.member.fullName}"></strong></p>
        <p>Còn phải thu: <strong class="money" th:text="${borrowing.unpaidFineAmount}"></strong></p>
        <form th:action="@{/borrowings/{id}/payments(id=${borrowing.id})}" th:object="${paymentForm}" method="post">
            <label for="amount">Số tiền thanh toán</label><input id="amount" type="number" min="0.01" step="0.01" th:attr="max=${borrowing.unpaidFineAmount}" th:field="*{amount}"><div class="field-error" th:errors="*{amount}"></div>
            <label for="method">Phương thức</label><select id="method" th:field="*{method}"><option value="">-- Chọn --</option><option value="CASH">Tiền mặt</option><option value="BANK_TRANSFER">Chuyển khoản</option><option value="OTHER">Khác</option></select><div class="field-error" th:errors="*{method}"></div>
            <label for="note">Ghi chú (không bắt buộc)</label><textarea id="note" rows="3" th:field="*{note}"></textarea><div class="field-error" th:errors="*{note}"></div>
            <p class="actions"><button class="btn" type="submit">Ghi nhận thanh toán</button><a class="btn light" th:href="@{/borrowings/{id}(id=${borrowing.id})}">Quay lại</a></p>
        </form>
    </section>
</main></body>
</html>
